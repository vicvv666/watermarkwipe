<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
{% set seo_page = 'home' %}
{% include 'components/seo.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
{% include 'components/cookie.html' %}
{% include 'components/nav.html' %}
<main>
<section class="hero" style="padding: 3rem 0;">
  <div class="container">
    <h1 class="display-hero hero-title" style="font-size: 2rem; white-space:nowrap;">{{ i18n.auth.login_title }}</h1>
  </div>
</section>
<section class="section" style="padding-top: 0;">
  <div class="container">
    <div class="card" style="max-width: 400px; margin: 0 auto;">
      <form action="/login" method="post" enctype="multipart/form-data">
        <div style="margin-bottom: var(--sp-md);">
          <label style="display: block; font-weight: 600; margin-bottom: var(--sp-sm);">{{ i18n.auth.email }}</label>
          <input type="email" name="email" placeholder="your@email.com" required style="width: 100%; padding: var(--sp-sm); border-radius: var(--radius-md); border: 1px solid var(--color-border);">
        </div>
        <div style="margin-bottom: var(--sp-md);">
          <label style="display: block; font-weight: 600; margin-bottom: var(--sp-sm);">{{ i18n.auth.password }}</label>
          <input type="password" name="password" placeholder="••••••" required style="width: 100%; padding: var(--sp-sm); border-radius: var(--radius-md); border: 1px solid var(--color-border);">
        </div>
        <label style="display: flex; align-items: center; gap: var(--sp-sm); cursor: pointer; margin-bottom: var(--sp-md);">
          <input type="checkbox" name="remember" style="accent-color: var(--color-primary);">
          <span>{{ i18n.auth.remember }}</span>
        </label>
        <button type="submit" class="btn btn-primary btn-block">{{ i18n.auth.login_btn }}</button>
        <p style="text-align: center; margin-top: var(--sp-md);">
          <a href="/register" style="color: var(--color-primary); text-decoration: none;">{{ i18n.auth.no_account }}</a>
        </p>
      </form>
    </div>
  </div>
</section>
</main>
{% include 'components/footer.html' %}
<div id="toastContainer"></div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
